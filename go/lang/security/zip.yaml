rules:
- id: path-traversal-inside-zip-extraction
  message: >-
    Archive member name from a zip file reaches a filesystem write without
    validating that the resolved destination stays inside the target
    directory. A malicious archive containing entries such as
    `../../etc/passwd` can write files outside of the intended directory
    (Zip Slip). Resolve the destination with `filepath.Clean` and reject it
    unless `strings.HasPrefix(dest, target)` holds, or use
    `filepath-securejoin`.
  metadata:
    cwe:
    - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
    source_rule_url: https://github.com/securego/gosec/issues/205
    category: security
    technology:
    - go
    owasp:
    - A05:2017 - Broken Access Control
    - A01:2021 - Broken Access Control
    - A01:2025 - Broken Access Control
    references:
    - https://owasp.org/Top10/A01_2021-Broken_Access_Control
    - https://security.snyk.io/research/zip-slip-vulnerability
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: LOW
    confidence: MEDIUM
  languages: [go]
  severity: WARNING
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $FILE.Name
      - pattern: $FILE.FileHeader.Name
    - pattern-inside: |
        for _, $FILE := range $READER.File {
          ...
        }
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: os.MkdirAll($PATH, ...)
      - pattern: os.Mkdir($PATH, ...)
      - pattern: os.OpenFile($PATH, ...)
      - pattern: os.Create($PATH)
      - pattern: os.WriteFile($PATH, ...)
      - pattern: ioutil.WriteFile($PATH, ...)
      - pattern: os.Rename($_, $PATH)
    - focus-metavariable: $PATH
  pattern-sanitizers:
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: strings.HasPrefix($PATH, $TARGET)
      - pattern: strings.HasPrefix($PATH, $TARGET+string(filepath.Separator))
      - pattern: filepath.Rel($TARGET, $PATH)
    - focus-metavariable: $PATH
  - pattern: securejoin.SecureJoin(...)
